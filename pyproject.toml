[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "DHTOL-SELBER"
version = "0.1.0"
description = "DHTOL measurement analyzer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.47,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "plotly>=6,<7",
    "reportlab>=4,<5",
    "kaleido>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
